<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Corazón a Salvo — Desfibriladores en Chile</title>
<meta name="description" content="Mapa abierto y colaborativo de desfibriladores (DEA) en Chile. Encuentra el más cercano y ayuda a mantenerlo actualizado.">

<meta property="og:title" content="Corazón a Salvo — Desfibriladores en Chile">
<meta property="og:description" content="Mapa abierto y colaborativo de desfibriladores (DEA) en Chile.">
<meta property="og:type" content="website">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">

<style>
  :root {
    --rojo: #d62828;
    --rojo-oscuro: #9d1c1c;
    --azul: #1d3557;
    --verde: #2a9d3f;
    --gris: #6c757d;
    --fondo: #ffffff;
    --texto: #1a1a1a;
    --borde: #e3e3e3;
    --sombra: 0 2px 12px rgba(0,0,0,.15);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--texto); background: var(--fondo);
    overscroll-behavior: none;
  }

  /* ---------- Encabezado ---------- */
  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
    background: var(--azul); color: #fff;
    padding: max(.6rem, env(safe-area-inset-top)) .8rem .6rem;
    display: flex; align-items: center; gap: .6rem;
    box-shadow: var(--sombra);
  }
  header h1 { font-size: 1.05rem; margin: 0; font-weight: 700; letter-spacing: -.01em; }
  header .conteo { font-size: .75rem; opacity: .85; font-weight: 400; display: block; }
  .logo { font-size: 1.4rem; line-height: 1; }

  .emergencia {
    margin-left: auto; background: var(--rojo); color: #fff;
    border: 0; border-radius: 999px; padding: .5rem .85rem;
    font-size: .8rem; font-weight: 700; cursor: pointer;
    text-decoration: none; white-space: nowrap;
  }

  /* ---------- Filtros ---------- */
  .filtros {
    position: fixed; top: 0; left: 0; right: 0; z-index: 999;
    margin-top: calc(3.1rem + env(safe-area-inset-top));
    padding: .5rem .8rem; display: flex; gap: .4rem;
    overflow-x: auto; -webkit-overflow-scrolling: touch;
    background: linear-gradient(180deg, rgba(255,255,255,.97), rgba(255,255,255,.82));
    scrollbar-width: none;
  }
  .filtros::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; border: 1px solid var(--borde); background: #fff;
    border-radius: 999px; padding: .38rem .75rem; font-size: .8rem;
    cursor: pointer; white-space: nowrap; font-weight: 500;
  }
  .chip[aria-pressed="true"] { background: var(--azul); color: #fff; border-color: var(--azul); }

  /* ---------- Mapa ---------- */
  #mapa { position: absolute; inset: 0; z-index: 1; }

  .marcador {
    width: 26px; height: 26px; border-radius: 50%;
    display: grid; place-items: center;
    color: #fff; font-size: 13px; font-weight: 700;
    border: 2.5px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.4);
  }
  .m-verificado { background: var(--verde); }
  .m-sin_verificar { background: var(--gris); }
  .m-desactualizado { background: #e08e0b; }
  .m-reportado_inexistente { background: #b0b0b0; opacity: .65; }

  .grupo {
    background: rgba(29,53,87,.9); color: #fff; border: 3px solid rgba(255,255,255,.85);
    border-radius: 50%; display: grid; place-items: center;
    font-weight: 700; font-size: .8rem; box-shadow: 0 2px 8px rgba(0,0,0,.3);
  }

  /* ---------- Botones flotantes ---------- */
  .acciones {
    position: fixed; right: .8rem; z-index: 900;
    bottom: calc(1rem + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: .55rem;
  }
  .fab {
    border: 0; border-radius: 999px; cursor: pointer; font-weight: 700;
    box-shadow: var(--sombra); display: flex; align-items: center; gap: .45rem;
    padding: .8rem 1.05rem; font-size: .9rem;
  }
  .fab-primario { background: var(--rojo); color: #fff; }
  .fab-secundario { background: #fff; color: var(--azul); border: 1px solid var(--borde); }

  /* ---------- Panel de detalle ---------- */
  .panel {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 1100;
    background: #fff; border-radius: 18px 18px 0 0;
    box-shadow: 0 -4px 24px rgba(0,0,0,.25);
    padding: .6rem 1.1rem calc(1.1rem + env(safe-area-inset-bottom));
    transform: translateY(110%); transition: transform .22s ease;
    max-height: 78vh; overflow-y: auto;
  }
  .panel.abierto { transform: translateY(0); }
  .agarre { width: 40px; height: 4px; background: var(--borde); border-radius: 2px; margin: .2rem auto .8rem; }

  .panel h2 { margin: 0 0 .2rem; font-size: 1.15rem; line-height: 1.25; }
  .panel .meta { color: var(--gris); font-size: .85rem; margin: 0 0 .8rem; }

  .insignia {
    display: inline-flex; align-items: center; gap: .3rem;
    border-radius: 999px; padding: .25rem .6rem;
    font-size: .75rem; font-weight: 700; margin-bottom: .7rem;
  }
  .i-verificado { background: #e4f6e7; color: #1c6b2b; }
  .i-sin_verificar { background: #f0f0f0; color: #555; }
  .i-desactualizado { background: #fdf0d9; color: #8a5a06; }
  .i-reportado_inexistente { background: #f5e2e2; color: #8a1c1c; }

  .referencia {
    background: #f7f9fc; border-left: 3px solid var(--azul);
    padding: .7rem .8rem; border-radius: 0 8px 8px 0;
    font-size: .92rem; margin-bottom: .9rem; line-height: 1.45;
  }
  .referencia strong { display: block; font-size: .72rem; text-transform: uppercase;
    letter-spacing: .04em; color: var(--gris); margin-bottom: .2rem; }

  .botones { display: grid; grid-template-columns: 1fr 1fr; gap: .55rem; margin-bottom: .7rem; }
  .btn {
    border: 1px solid var(--borde); background: #fff; border-radius: 10px;
    padding: .8rem .5rem; font-size: .87rem; font-weight: 600; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: .35rem;
    text-decoration: none; color: var(--texto); text-align: center;
  }
  .btn-si { border-color: #b9e2c1; background: #f2fbf4; color: #1c6b2b; }
  .btn-no { border-color: #f0cccc; background: #fdf5f5; color: #8a1c1c; }
  .btn-ancho { grid-column: 1 / -1; background: var(--azul); color: #fff; border-color: var(--azul); }

  .fuentes { font-size: .76rem; color: var(--gris); line-height: 1.5; }
  .cerrar {
    position: absolute; top: .55rem; right: .8rem; background: none; border: 0;
    font-size: 1.5rem; cursor: pointer; color: var(--gris); line-height: 1;
    width: 32px; height: 32px;
  }

  /* ---------- Carga y avisos ---------- */
  .cargando {
    position: fixed; inset: 0; z-index: 2000; display: grid; place-items: center;
    background: var(--fondo); text-align: center; padding: 2rem;
  }
  .cargando.oculto { display: none; }
  .latido { font-size: 3rem; animation: latir 1.1s ease-in-out infinite; }
  @keyframes latir { 0%,100% { transform: scale(1); } 50% { transform: scale(1.18); } }

  .aviso {
    position: fixed; bottom: calc(5.5rem + env(safe-area-inset-bottom)); left: 50%;
    transform: translateX(-50%); z-index: 1200;
    background: var(--azul); color: #fff; padding: .7rem 1.1rem;
    border-radius: 999px; font-size: .85rem; box-shadow: var(--sombra);
    opacity: 0; pointer-events: none; transition: opacity .25s; max-width: 90vw; text-align: center;
  }
  .aviso.visible { opacity: 1; }

  .pie {
    font-size: .72rem; color: var(--gris); text-align: center;
    padding: .8rem 1rem; line-height: 1.5; border-top: 1px solid var(--borde); margin-top: .3rem;
  }
  .pie a { color: var(--azul); }

  @media (min-width: 768px) {
    .panel { left: auto; right: 1rem; bottom: 1rem; width: 380px; border-radius: 16px; max-height: 72vh; }
    .panel:not(.abierto) { transform: translateY(130%); }
  }
</style>
</head>
<body>

<div class="cargando" id="cargando">
  <div>
    <div class="latido">❤️</div>
    <p><strong>Corazón a Salvo</strong><br>Cargando desfibriladores…</p>
  </div>
</div>

<header>
  <span class="logo" aria-hidden="true">❤️</span>
  <h1>Corazón a Salvo
    <span class="conteo" id="conteo">Desfibriladores en Chile</span>
  </h1>
  <a class="emergencia" href="tel:131">📞 131 SAMU</a>
</header>

<nav class="filtros" id="filtros" aria-label="Filtrar por tipo de lugar"></nav>

<div id="mapa"></div>

<div class="acciones">
  <button class="fab fab-secundario" id="btnCerca">📍 Cerca mío</button>
  <button class="fab fab-primario" id="btnAgregar">➕ Agregar DEA</button>
</div>

<div class="panel" id="panel" role="dialog" aria-labelledby="panelTitulo">
  <div class="agarre"></div>
  <button class="cerrar" id="btnCerrar" aria-label="Cerrar">×</button>
  <div id="panelContenido"></div>
</div>

<div class="aviso" id="aviso" role="status"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
/* ------------------------------------------------------------------
   Configuración

   formularioUrl: si tienes un formulario público sin login (por ejemplo
   Google Forms), pégalo acá y los botones de reporte lo usarán. Si lo dejas
   vacío, el mapa abre una incidencia de GitHub prellenada, que funciona
   igual pero requiere cuenta.
------------------------------------------------------------------ */
const CONFIG = {
  repo: "goyogramadors/corazonasalvo",
  formularioUrl: "",
  instagram: "https://instagram.com/corazonasalvo"
};

const TIPOS = {
  comercio:       { nombre: "Comercio",     icono: "🛒" },
  educacional:    { nombre: "Educación",    icono: "🎓" },
  salud:          { nombre: "Salud",        icono: "🏥" },
  salud_24h:      { nombre: "Salud 24h",    icono: "🚑" },
  metro:          { nombre: "Metro",        icono: "🚇" },
  transporte:     { nombre: "Terminales",   icono: "✈️" },
  deportivo:      { nombre: "Deporte",      icono: "⚽" },
  hotel:          { nombre: "Hoteles",      icono: "🏨" },
  cultura:        { nombre: "Cine/Teatro",  icono: "🎭" },
  institucional:  { nombre: "Institución",  icono: "🏛️" },
  sin_clasificar: { nombre: "Otros",        icono: "📍" }
};

const ESTADOS = {
  verificado:            { texto: "Verificado en terreno",       icono: "✅" },
  sin_verificar:         { texto: "Sin verificar",               icono: "❔" },
  desactualizado:        { texto: "Verificación antigua",        icono: "⏳" },
  reportado_inexistente: { texto: "Reportado como inexistente",  icono: "⚠️" }
};

const FUENTES = {
  o: "Registro oficial SEREMI de Salud",
  c: "Reportado por la comunidad",
  m: "OpenStreetMap"
};

const mapa = L.map("mapa", { zoomControl: false, tap: true })
  .setView([-33.45, -70.66], 12);

L.control.zoom({ position: "bottomleft" }).addTo(mapa);

L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> · Datos: Corazón a Salvo (ODbL)'
}).addTo(mapa);

const grupos = L.markerClusterGroup({
  maxClusterRadius: 55,
  spiderfyOnMaxZoom: true,
  showCoverageOnHover: false,
  iconCreateFunction(grupo) {
    const n = grupo.getChildCount();
    const tamano = n < 15 ? 36 : n < 100 ? 44 : 52;
    return L.divIcon({
      html: `<div class="grupo" style="width:${tamano}px;height:${tamano}px">${n}</div>`,
      className: "", iconSize: [tamano, tamano]
    });
  }
});

let todos = [];
let marcadores = [];
let filtroActivo = null;

function icono(punto) {
  const tipo = TIPOS[punto.tipo] || TIPOS.sin_clasificar;
  return L.divIcon({
    html: `<div class="marcador m-${punto.estado}" title="${tipo.nombre}">${tipo.icono}</div>`,
    className: "", iconSize: [26, 26], iconAnchor: [13, 13], popupAnchor: [0, -13]
  });
}

/* ------------------------------------------------------------------
   Carga de datos. El archivo viene como arreglos posicionales para que
   pese menos; acá se vuelve a convertir en objetos.
------------------------------------------------------------------ */
fetch("datos/dea-chile.min.geojson")
  .then(r => {
    if (!r.ok) throw new Error("No se pudo cargar el mapa");
    return r.json();
  })
  .then(datos => {
    const claves = datos.columnas;
    todos = datos.puntos.map(fila => {
      const punto = {};
      claves.forEach((clave, i) => { punto[clave] = fila[i]; });
      return punto;
    });

    dibujar(todos);
    construirFiltros();
    document.getElementById("conteo").textContent =
      `${todos.length.toLocaleString("es-CL")} desfibriladores mapeados`;
    document.getElementById("cargando").classList.add("oculto");
  })
  .catch(error => {
    document.getElementById("cargando").innerHTML =
      `<div><p><strong>No pudimos cargar el mapa.</strong></p>
       <p style="color:#6c757d;font-size:.9rem">${error.message}. Revisa tu conexión y recarga.</p>
       <p style="margin-top:1.5rem"><a href="tel:131" style="color:#d62828;font-weight:700">📞 Llamar al 131 (SAMU)</a></p></div>`;
  });

function dibujar(puntos) {
  grupos.clearLayers();
  marcadores = puntos.map(punto => {
    const marcador = L.marker([punto.lat, punto.lon], { icon: icono(punto) });
    marcador.on("click", () => abrirPanel(punto));
    return marcador;
  });
  grupos.addLayers(marcadores);
  mapa.addLayer(grupos);
}

function construirFiltros() {
  const contenedor = document.getElementById("filtros");
  const presentes = [...new Set(todos.map(p => p.tipo))]
    .sort((a, b) => (TIPOS[a]?.nombre || a).localeCompare(TIPOS[b]?.nombre || b));

  const crear = (clave, etiqueta, activo) => {
    const chip = document.createElement("button");
    chip.className = "chip";
    chip.textContent = etiqueta;
    chip.setAttribute("aria-pressed", activo ? "true" : "false");
    chip.onclick = () => {
      filtroActivo = (filtroActivo === clave) ? null : clave;
      [...contenedor.children].forEach(c => c.setAttribute("aria-pressed", "false"));
      contenedor.firstChild.setAttribute("aria-pressed", filtroActivo ? "false" : "true");
      if (filtroActivo) chip.setAttribute("aria-pressed", "true");
      dibujar(filtroActivo ? todos.filter(p => p.tipo === filtroActivo) : todos);
    };
    return chip;
  };

  contenedor.appendChild(crear(null, "Todos", true));
  presentes.forEach(tipo => {
    const info = TIPOS[tipo] || { nombre: tipo, icono: "📍" };
    contenedor.appendChild(crear(tipo, `${info.icono} ${info.nombre}`, false));
  });
}

/* ------------------------------------------------------------------
   Panel de detalle
------------------------------------------------------------------ */
const panel = document.getElementById("panel");

function abrirPanel(punto) {
  const tipo = TIPOS[punto.tipo] || TIPOS.sin_clasificar;
  const estado = ESTADOS[punto.estado] || ESTADOS.sin_verificar;
  const identificador = `dea-cl-${punto.id}`;

  const fuentes = (punto.fuentes || "").split("")
    .map(c => FUENTES[c]).filter(Boolean).join(" · ") || "Origen no registrado";

  const referencia = punto.referencia
    ? `<div class="referencia"><strong>Dónde encontrarlo</strong>${escapar(punto.referencia)}</div>`
    : `<div class="referencia"><strong>Dónde encontrarlo</strong>
         No sabemos en qué parte del recinto está.
         <a href="${urlReporte("verificar", punto)}" target="_blank" rel="noopener">Ayúdanos a precisarlo</a>.
       </div>`;

  document.getElementById("panelContenido").innerHTML = `
    <h2 id="panelTitulo">${escapar(punto.nombre) || "Desfibrilador"}</h2>
    <p class="meta">${tipo.icono} ${tipo.nombre}${punto.comuna ? " · " + escapar(punto.comuna) : ""}
      ${punto.equipos > 1 ? ` · ${punto.equipos} equipos` : ""}</p>

    <span class="insignia i-${punto.estado}">${estado.icono} ${estado.texto}</span>

    ${referencia}

    <div class="botones">
      <a class="btn btn-ancho" target="_blank" rel="noopener"
         href="https://www.google.com/maps/dir/?api=1&destination=${punto.lat},${punto.lon}">
        🧭 Cómo llegar
      </a>
      <a class="btn btn-si" target="_blank" rel="noopener" href="${urlReporte("confirmar", punto)}">
        ✅ Sigue aquí
      </a>
      <a class="btn btn-no" target="_blank" rel="noopener" href="${urlReporte("ausente", punto)}">
        ❌ Ya no está
      </a>
    </div>

    <p class="fuentes">
      <strong>${identificador}</strong><br>
      ${punto.direccion ? escapar(punto.direccion) + "<br>" : ""}
      Fuente: ${fuentes}
    </p>

    <p class="pie">
      Información de referencia construida por la comunidad, no un servicio de
      emergencia. Ante un paro cardíaco llama al <a href="tel:131"><strong>131</strong></a> de inmediato.
    </p>
  `;

  panel.classList.add("abierto");
}

document.getElementById("btnCerrar").onclick = () => panel.classList.remove("abierto");

function escapar(texto) {
  const div = document.createElement("div");
  div.textContent = texto ?? "";
  return div.innerHTML;
}

/* ------------------------------------------------------------------
   Reportes. Sin servidor propio: se arma una incidencia prellenada, o se
   abre el formulario configurado en CONFIG.formularioUrl.
------------------------------------------------------------------ */
function urlReporte(accion, punto) {
  if (CONFIG.formularioUrl) {
    const parametros = new URLSearchParams({
      accion,
      punto: punto ? `dea-cl-${punto.id}` : "",
      lugar: punto ? punto.nombre : ""
    });
    return `${CONFIG.formularioUrl}?${parametros}`;
  }

  const base = `https://github.com/${CONFIG.repo}/issues/new`;

  if (accion === "nuevo") {
    const centro = mapa.getCenter();
    return `${base}?template=1-nuevo-dea.yml&coordenadas=${centro.lat.toFixed(5)},${centro.lng.toFixed(5)}`;
  }

  const identificador = `dea-cl-${punto.id} — ${punto.nombre}`;
  const resultados = {
    confirmar: "✅ Está ahí, tal como dice el mapa",
    ausente: "❌ Fui y no lo encontré",
    verificar: ""
  };
  const parametros = new URLSearchParams({
    template: "2-verificar-dea.yml",
    title: `[Verificación] ${punto.nombre}`,
    identificador,
    resultado: resultados[accion] || "",
    fecha: new Date().toISOString().slice(0, 10)
  });
  return `${base}?${parametros}`;
}

document.getElementById("btnAgregar").onclick = () => {
  mostrarAviso("Centra el mapa donde está el DEA y completa el formulario");
  window.open(urlReporte("nuevo", null), "_blank", "noopener");
};

/* ------------------------------------------------------------------
   Búsqueda por cercanía
------------------------------------------------------------------ */
document.getElementById("btnCerca").onclick = () => {
  if (!navigator.geolocation) {
    return mostrarAviso("Tu navegador no permite ubicarte");
  }
  mostrarAviso("Buscando tu ubicación…");

  navigator.geolocation.getCurrentPosition(
    posicion => {
      const { latitude: lat, longitude: lon } = posicion.coords;
      mapa.setView([lat, lon], 15);

      L.circleMarker([lat, lon], {
        radius: 8, color: "#1d3557", fillColor: "#4a7ab8", fillOpacity: .9, weight: 3
      }).addTo(mapa).bindPopup("Estás aquí");

      const cercanos = todos
        .map(p => ({ ...p, distancia: distancia(lat, lon, p.lat, p.lon) }))
        .sort((a, b) => a.distancia - b.distancia);

      if (!cercanos.length) return;
      const mas = cercanos[0];
      const metros = Math.round(mas.distancia);
      mostrarAviso(metros < 1000
        ? `El DEA más cercano está a ${metros} m`
        : `El DEA más cercano está a ${(metros / 1000).toFixed(1)} km`);
      abrirPanel(mas);
    },
    () => mostrarAviso("No pudimos obtener tu ubicación. Revisa los permisos."),
    { enableHighAccuracy: true, timeout: 10000 }
  );
};

function distancia(lat1, lon1, lat2, lon2) {
  const R = 6371000, rad = Math.PI / 180;
  const dLat = (lat2 - lat1) * rad, dLon = (lon2 - lon1) * rad;
  const a = Math.sin(dLat / 2) ** 2 +
            Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

let temporizador;
function mostrarAviso(texto) {
  const aviso = document.getElementById("aviso");
  aviso.textContent = texto;
  aviso.classList.add("visible");
  clearTimeout(temporizador);
  temporizador = setTimeout(() => aviso.classList.remove("visible"), 4000);
}
</script>
</body>
</html>
